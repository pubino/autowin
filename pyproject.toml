[project]
name = "autowin"
version = "0.1.0"
description = "Scripts and tests for disposable, unattended Windows 11 (Arm64) VMs in UTM on Apple Silicon"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S603", "S607"]  # tests run the scripts with argument lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108", "E501", "S314"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tests", "examples/tools"]
